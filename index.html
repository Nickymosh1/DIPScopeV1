<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DIPScope — MHHS interface, DIP message and rejection-code reference.">
  <meta name="theme-color" content="#15121b">
  <title>DIPScope | MHHS Interface & Message Reference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-indicator" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-panel">
      <span class="loading-mark" aria-hidden="true"></span>
      <div>
        <strong>Opening DIPScope</strong>
        <span>Loading MHHS reference data…</span>
      </div>
    </div>
  </div>

  <header class="product-header">
    <div class="product-header-inner">
      <button class="brand-button" type="button" data-nav="home" aria-label="DIPScope home">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="13" stroke="currentColor" stroke-width="2.2"/>
            <circle cx="20" cy="20" r="5" stroke="currentColor" stroke-width="2.2"/>
            <path d="M20 2.75v5.5M37.25 20h-5.5M20 37.25v-5.5M2.75 20h5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="m27.7 12.3-3.7 3.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">DIP<span>Scope</span></span>
          <span class="brand-tagline">MHHS technical reference</span>
        </span>
      </button>

      <nav class="primary-nav" aria-label="Primary navigation">
        <button type="button" class="primary-nav-link" data-nav="home">Home</button>
        <button type="button" class="primary-nav-link" data-nav="interfaces">Interfaces</button>
        <button type="button" class="primary-nav-link" data-nav="data">Data reference</button>
        <button type="button" class="primary-nav-link" data-nav="rejections">Rejection codes</button>
      </nav>

      <div class="header-tools">
        <button id="globalSearchBtn" class="command-button" type="button" aria-haspopup="dialog" aria-controls="commandPalette">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 4.4 4.4" stroke-linecap="round"/></svg>
          <span>Search</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="version-chip" title="Current technical reference status">
          <span class="version-dot" aria-hidden="true"></span>
          <span><strong id="sourceVersion">DIP reference</strong><small id="sourceChecked">Loading status…</small></span>
        </div>
      </div>
    </div>
  </header>

  <main id="appContent" class="app-main" tabindex="-1"></main>

  <footer class="product-footer">
    <div class="product-footer-inner">
      <span>DIPScope is a working technical reference, not an authoritative regulatory source.</span>
      <span id="footerReference">Source status loading…</span>
    </div>
  </footer>

  <div id="commandPalette" class="command-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="commandTitle">
    <section class="command-palette">
      <header class="command-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 4.4 4.4" stroke-linecap="round"/></svg>
        <input id="commandSearchInput" type="search" autocomplete="off" placeholder="Search interfaces, events, blocks, data items or rejection codes…" aria-label="Search DIPScope">
        <kbd>Esc</kbd>
      </header>
      <div class="command-meta">
        <span id="commandTitle">Search DIPScope</span>
        <span>Try IF-021, MDRStop, B013, MPAN or REG</span>
      </div>
      <div id="commandResults" class="command-results"></div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
